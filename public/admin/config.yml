backend:
  name: git-gateway
  branch: main 

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "portofolio_data"
    label: "Data Portofolio"
    files:
      # 1. File JSON Pengalaman
      - label: "Pengalaman Kerja"
        name: "pengalaman"
        file: "public/content/pengalaman.json"
        fields:
          - label: "Daftar Pengalaman"
            name: "items"
            widget: "list"
            fields:
              - {label: "Posisi", name: "title", widget: "string"}
              - {label: "Perusahaan", name: "company", widget: "string"}
              - {label: "Tools yang Digunakan", name: "tools", widget: "list", required: false, hint: "Contoh: Excel, Looker Studio, Power BI"}
              - {label: "Bulan Mulai", name: "start_date", widget: "string", required: false, hint: "Contoh: June 2025"}
              - {label: "Bulan Selesai", name: "end_date", widget: "string", required: false, hint: "Contoh: July 2025 atau Present"}
              - {label: "Tahun (Legacy / fallback)", name: "year", widget: "string", required: false, hint: "Opsional, hanya untuk data lama"}
              - {label: "Deskripsi", name: "description", widget: "text"}
              - {label: "Pencapaian (Opsional)", name: "achievements", widget: "list", required: false}
              - {label: "Foto Kegiatan (Opsional)", name: "foto_kegiatan", widget: "image", required: false}

      # 2. File JSON Pengalaman Akademik
      - label: "Pengalaman Akademik"
        name: "akademik"
        file: "public/content/akademik.json"
        fields:
          - label: "Daftar Pengalaman Akademik"
            name: "items"
            widget: "list"
            fields:
              - {label: "Judul/Peran", name: "title", widget: "string"}
              - {label: "Institusi", name: "institution", widget: "string"}
              - {label: "Tools yang Digunakan", name: "tools", widget: "list", required: false, hint: "Contoh: Excel, Looker Studio, R"}
              - {label: "Bulan Mulai", name: "start_date", widget: "string", required: false, hint: "Contoh: June 2025"}
              - {label: "Bulan Selesai", name: "end_date", widget: "string", required: false, hint: "Contoh: July 2025 atau Present"}
              - {label: "Tahun (Legacy / fallback)", name: "year", widget: "string", required: false, hint: "Opsional, hanya untuk data lama"}
              - {label: "Deskripsi", name: "description", widget: "text"}
              - {label: "Pencapaian (Opsional)", name: "achievements", widget: "list", required: false}
              - {label: "Foto Kegiatan (Opsional)", name: "foto_kegiatan", widget: "image", required: false}

      # 3. File JSON Pengalaman Organisasi
      - label: "Pengalaman Organisasi"
        name: "organisasi"
        file: "public/content/organisasi.json"
        fields:
          - label: "Daftar Pengalaman Organisasi"
            name: "items"
            widget: "list"
            fields:
              - {label: "Jabatan/Peran", name: "title", widget: "string"}
              - {label: "Organisasi", name: "organization", widget: "string"}
              - {label: "Tools yang Digunakan", name: "tools", widget: "list", required: false, hint: "Contoh: Excel, Looker Studio, Canva"}
              - {label: "Bulan Mulai", name: "start_date", widget: "string", required: false, hint: "Contoh: June 2025"}
              - {label: "Bulan Selesai", name: "end_date", widget: "string", required: false, hint: "Contoh: July 2025 atau Present"}
              - {label: "Tahun (Legacy / fallback)", name: "year", widget: "string", required: false, hint: "Opsional, hanya untuk data lama"}
              - {label: "Deskripsi", name: "description", widget: "text"}
              - {label: "Pencapaian (Opsional)", name: "achievements", widget: "list", required: false}
              - {label: "Foto Kegiatan (Opsional)", name: "foto_kegiatan", widget: "image", required: false}

      # 4. File JSON Proyek
      - label: "Proyek"
        name: "projects"
        file: "public/content/projects.json"
        fields:
          - label: "Daftar Proyek"
            name: "items"
            widget: "list"
            fields:
              - {label: "Judul Proyek", name: "title", widget: "string"}
              - {label: "Deskripsi (Paragraf)", name: "description", widget: "text"}
              - {label: "Tools/Teknologi", name: "tools", widget: "list", required: false}
              - {label: "Link Proyek (Opsional)", name: "link", widget: "string", required: false, hint: "Masukkan URL publik jika proyek bisa dibuka"}
              - {label: "Status Akses / Label", name: "access", widget: "string", required: false, hint: "Contoh: NDA, Credentials, Not Public"}
              - {label: "Media/Gambar Proyek", name: "media", widget: "image", required: false}

      # 5. File JSON Awards
      - label: "Penghargaan"
        name: "awards"
        file: "public/content/awards.json"
        fields:
          - label: "Daftar Penghargaan"
            name: "items"
            widget: "list"
            fields:
              - {label: "Judul Penghargaan", name: "title", widget: "string"}
              - {label: "Pemberi Penghargaan", name: "issuer", widget: "string"}
              - {label: "Tahun", name: "year", widget: "string"}
              - {label: "Deskripsi", name: "description", widget: "text"}

      # 7. File JSON Kredensial
      - label: "Kredensial & Sertifikasi"
        name: "kredensial"
        file: "public/content/kredensial.json"
        fields:
          - label: "Daftar Kredensial"
            name: "items"
            widget: "list"
            fields:
              - {label: "Nama Sertifikasi", name: "name", widget: "string"}
              - {label: "Penyelenggara", name: "issuer", widget: "string"}
              - {label: "Deskripsi", name: "description", widget: "text"}
      
      # 8. File JSON Profil
      - label: "Data Profil Utama"
        name: "profil"
        file: "public/content/profil.json"
        fields:
          - {label: "Nama Lengkap", name: "nama", widget: "string"}
          - {label: "Titel/Gelar", name: "titel", widget: "string"}
          - {label: "Spesialisasi Singkat", name: "spesialisasi_singkat", widget: "string"}
          - {label: "Deskripsi Profil (Paragraf)", name: "deskripsi", widget: "text"}
          - {label: "Foto Profil", name: "foto", widget: "image"}
          - {label: "File Resume", name: "resume", widget: "file", required: false}

      